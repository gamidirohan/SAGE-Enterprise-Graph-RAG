opencollection: 1.0.0

info:
  name: SAGE - Graph RAG
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Authorization
      value: Bearer {{GROQ_API_KEY}}
    - name: Content-Type
      value: application/json
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
