info:
  name: List Conversation Messages
  type: http
  seq: 5

http:
  method: GET
  url: http://127.0.0.1:8000/api/conversations/{{conversation_id}}/messages
  headers:
    - name: X-User-Id
      value: "{{user_id}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
