info:
  name: Send Conversation Message
  type: http
  seq: 3

http:
  method: POST
  url: http://127.0.0.1:8000/api/conversations/{{conversation_id}}/messages
  headers:
    - name: Content-Type
      value: application/json
    - name: X-User-Id
      value: "{{user_id}}"
  body:
    type: json
    data: |-
      {
        "content": "{{message_content}}",
        "receiverId": "{{receiver_id}}",
        "groupId": "{{group_id}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
